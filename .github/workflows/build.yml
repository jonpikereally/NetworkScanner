name: Build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Universal release build (arm64 + x86_64)
        run: UPDATE_NOTES="CI build" ./release.sh
      - name: Check the bundle
        run: |
          lipo -info NetworkScanner.app/Contents/MacOS/NetworkScanner
          /usr/libexec/PlistBuddy -c 'Print' NetworkScanner.app/Contents/Info.plist
          unzip -l updates/NetworkScanner.zip
          python3 -c 'import json; print(json.load(open("updates/latest.json")))'
